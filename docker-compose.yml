services:
  db:
    build: ./db
    container_name: db-service
    volumes:
      - ./db/data:/app/data
    networks:
      - ft-transcendence

  backend:
    build: ./backend
    container_name: backend
    volumes:
      - ./backend/public/avatars:/app/public/avatars
    depends_on:
      - db
    networks:
      - ft-transcendence

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "8443:443"
    restart: always
    depends_on:
      - backend
    volumes:
      - proxy_certs:/certs
    networks:
      - ft-transcendence

volumes:
  proxy_certs:

networks:
  ft-transcendence:
    driver: bridge
